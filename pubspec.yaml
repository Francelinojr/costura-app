name: costura_app
description: "Aplicativo completo para gerenciar negócio de costura com clientes, pedidos, orçamentos e portfólio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: any
  sqflite: any
  path: any
  intl: any
  provider: any
  image_picker: any
  cached_network_image: any
  flutter_local_notifications: any
  timezone: any
  uuid: any
  google_fonts: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600